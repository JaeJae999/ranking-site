<!-- ranking_female.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여자부 랭킹</title>
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 200px;
      background-color: #f0f0f0;
      padding: 20px;
    }
    aside h3 {
      margin-top: 0;
      font-size: 18px;
    }
    aside ul {
      list-style: none;
      padding-left: 0;
    }
    aside li {
      margin: 10px 0;
    }
    aside a {
      text-decoration: none;
      color: #333;
      font-weight: normal;
    }
    aside a.active {
      font-weight: bold;
      color: #2c3e50;
    }
    main {
      flex: 1;
      padding: 30px;
      background-color: #f9d5e5;
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .rank {
      font-size: 24px;
      font-weight: bold;
    }
    .gold { color: gold; }
    .silver { color: silver; }
    .bronze { color: #cd7f32; }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h3>🏷️ 메뉴</h3>
    <ul>
      <li><a href="index_male.html">남자부 경기 등록</a></li>
      <li><a href="index_female.html">여자부 경기 등록</a></li>
      <li><a href="ranking_male.html">남자부 랭킹</a></li>
      <li><a href="ranking_female.html" class="active">여자부 랭킹</a></li>
    </ul>
  </aside>
  <main>
    <h1>🎾 여자부 랭킹</h1>
    <div class="card-container" id="rankingCards"></div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyFJxVKLZ9DLrD8z24pSFpmKqityS_DSA",
    authDomain: "tennisscoreapp-52f66.firebaseapp.com",
    projectId: "tennisscoreapp-52f66",
    storageBucket: "tennisscoreapp-52f66.appspot.com",
    messagingSenderId: "1008742240515",
    appId: "1:1008742240515:web:3115bf170847fefdd51936"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("rankingCards");

  async function loadRanking() {
    const snapshot = await getDocs(collection(db, "players_female"));
    const players = [];

    snapshot.forEach(doc => {
      const data = doc.data();
      players.push({
        name: doc.id,
        win: data.wincount || 0,
        lose: data.losecount || 0,
        points: data.points || 0
      });
    });

    players.sort((a, b) => b.points - a.points);

    players.forEach((p, index) => {
      const rankClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
      const emoji = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="rank ${rankClass}">${emoji}</div>
        <h3>${p.name}</h3>
        <p>승: ${p.win} | 패: ${p.lose}</p>
        <p><strong>포인트: ${p.points}</strong></p>
      `;
      container.appendChild(card);
    });
  }

  loadRanking();
</script>
</body>
</html>
